<!--@@parte:99_fim.html-->

<div id="rotHint"><i>📱</i>Gire o celular para o modo paisagem</div>
<button id="fsBtn" type="button" hidden>⛶ Tela cheia</button>
<script>
(function(){
  var b=document.getElementById('fsBtn'),de=document.documentElement;
  if(window.PORTAL){if(b)b.hidden=true;return}/* portal: o próprio site dá a tela cheia (botão nosso é proibido) */
  var rf=de.requestFullscreen||de.webkitRequestFullscreen;
  /* app instalado (ícone na tela inicial) já abre em tela cheia: sem botão nem aviso */
  var app=function(){try{return location.protocol==='file:'||/[?&]apk=1/.test(location.search)||matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
  var isFs=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement)||app()};
  function upd(){b.hidden=!rf||isFs()||!(navigator.maxTouchPoints>0)}
  upd();
  function lockL(){try{var p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');if(p&&p.catch)p.catch(function(){})}catch(e){}}
  function goFs(){try{var r=rf.call(de);if(r&&r.then)r.then(lockL).catch(function(){});else lockL()}catch(e){}}
  b.addEventListener('click',goFs);
  /* no navegador do celular: o 1º toque na tela já entra em tela cheia sozinho (o navegador exige um toque antes) */
  var realFs=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement)};
  function first(){window.removeEventListener('pointerdown',first,true);if(app()){if(rf&&!realFs())goFs();else lockL();return}/* app: o 1º toque pede a tela cheia completa uma vez só por abertura (o aviso do Chrome aparece só essa vez) — escolha do dono */
    if(rf&&!isFs()&&navigator.maxTouchPoints>0)goFs()}
  window.addEventListener('pointerdown',first,true);
  document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd);
})();
</script>

</body></html>
